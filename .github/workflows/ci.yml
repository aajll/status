name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # ---------------------------------------------------------------------------
  # Build the library and run the full test suite under ASan + UBSan.
  # Runs on both Linux and macOS to catch platform-specific issues.
  # ---------------------------------------------------------------------------
  test:
    name: "Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y ninja-build

      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install meson
        run: pip install meson

      - name: Configure (debug + sanitizers)
        run: >
          meson setup build
          --buildtype=debug
          -Dbuild_tests=true
          -Db_sanitize=address,undefined

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --verbose

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog-${{ matrix.os }}
          path: build/meson-logs/testlog.txt

  # ---------------------------------------------------------------------------
  # ThreadSanitizer gate for the concurrent lost-update test. TSan and ASan are
  # mutually exclusive, so this is a dedicated job. The library uses relaxed
  # atomics, so a clean run proves the bit operations are genuinely atomic
  # rather than a benign-looking data race.
  # ---------------------------------------------------------------------------
  tsan:
    name: "ThreadSanitizer"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y ninja-build

      - name: Install meson
        run: pip install meson

      - name: Configure (debug + thread sanitizer)
        run: >
          meson setup build-tsan
          --buildtype=debug
          -Dbuild_tests=true
          -Db_sanitize=thread

      - name: Build
        run: meson compile -C build-tsan

      - name: Test
        run: meson test -C build-tsan --verbose

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog-tsan
          path: build-tsan/meson-logs/testlog.txt

  # ---------------------------------------------------------------------------
  # Verify the library compiles cleanly in release mode (no tests, no
  # sanitizers) - the configuration a downstream project would use.
  # ---------------------------------------------------------------------------
  release-build:
    name: "Release build"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y ninja-build

      - name: Install meson
        run: pip install meson

      - name: Configure (release)
        run: >
          meson setup build
          --buildtype=release
          -Dbuild_tests=false

      - name: Build
        run: meson compile -C build

  # ---------------------------------------------------------------------------
  # Code coverage gate. Builds with gcov instrumentation, runs the full
  # test suite, and fails the job if line or branch coverage drops below
  # the threshold.
  # ---------------------------------------------------------------------------
  coverage:
    name: "Coverage gate"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y ninja-build

      - name: Install meson and gcovr
        run: pip install meson gcovr

      # -fprofile-update=atomic makes gcov's counter increments atomic. The
      # concurrency test exercises the same instrumented branches from multiple
      # threads; with the default non-atomic counters those updates race, the
      # arc counts become inconsistent, and gcov derives negative branch counts
      # that abort the report (gcc bug 68080). Atomic updates keep them sane.
      - name: Configure (coverage)
        run: >
          meson setup build
          --buildtype=debug
          -Dbuild_tests=true
          -Db_coverage=true
          -Dc_args=-fprofile-update=atomic

      - name: Build
        run: meson compile -C build

      - name: Run tests
        run: meson test -C build --verbose

      - name: Generate coverage report
        run: |
          mkdir -p coverage-report
          gcovr \
            --root . \
            --filter 'src/' \
            --filter 'include/' \
            --html-details coverage-report/index.html \
            --txt coverage-report/summary.txt \
            --print-summary \
            --fail-under-line 80 \
            --fail-under-branch 70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/

  # ---------------------------------------------------------------------------
  # MISRA C:2023 static analysis via misch (cppcheck + misra addon), driven by
  # misra.toml. All three atomic backends are audited: the default GNU __atomic
  # branch plus the c11-atomics and no-atomics profiles, which the Meson build
  # never selects on its own. The audit is clean, so the job gates on zero
  # findings. The copyrighted rule texts are never committed: set a
  # MISRA_RULE_TEXTS repository secret (the file's contents) to get categorised
  # output; without it findings are still detected and still fail the job, only
  # headlines/categories are absent. `misch deviations` enforces that every
  # suppression carries a justification.
  # ---------------------------------------------------------------------------
  misra:
    name: "MISRA (misch)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y ninja-build

      # Ubuntu 24.04's cppcheck (2.13) accepts only built-in platform presets
      # for --platform and rejects the file path that misra.toml configures,
      # aborting the whole run. The Homebrew bottle is a current cppcheck that
      # loads analysis/mcu8_platform.xml; brew is preinstalled on the runner.
      - name: Install cppcheck
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install cppcheck
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          cppcheck --version

      - name: Install meson and misch
        run: pip install meson misch

      - name: Provide MISRA rule texts (optional secret)
        env:
          RULE_TEXTS: ${{ secrets.MISRA_RULE_TEXTS }}
        run: |
          if [ -n "$RULE_TEXTS" ]; then
            printf '%s\n' "$RULE_TEXTS" > "$RUNNER_TEMP/misra_rule_texts.txt"
            echo "MISRA_RULE_TEXTS=$RUNNER_TEMP/misra_rule_texts.txt" >> "$GITHUB_ENV"
          else
            echo "No MISRA_RULE_TEXTS secret; findings will be category: unknown."
          fi

      - name: Analyse (default GNU __atomic backend)
        run: misch run -v

      - name: Analyse (C11 atomics profile)
        run: misch run --profile c11-atomics -v

      - name: Analyse (no-atomics profile)
        run: misch run --profile no-atomics -v

      - name: Deviation record
        run: misch deviations
